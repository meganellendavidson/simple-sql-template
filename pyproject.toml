[tool.poetry]
name = "simple-sql-template"
version = "0.1.0"
description = "PostgreSQL database connection template using psycopg3"
authors = ["Megan Davidson <meganellen.davidson@yahoo.co.nz>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
psycopg = {extras = ["binary"], version = "^3.1.18"}
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"
isort = "^7.0.0"
gitlint = "^0.19.1"
mypy = "^1.19.1"
pylint = "^4.0.4"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
