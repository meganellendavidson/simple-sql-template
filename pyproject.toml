[tool.poetry]
name = "psycopg3-db-template"
version = "0.1.0"
description = "PostgreSQL database connection template using psycopg3"
authors = ["Megan Davidson <meganellen.davidson@yahoo.co.nz>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
psycopg = {extras = ["binary"], version = "^3.1.18"}
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
